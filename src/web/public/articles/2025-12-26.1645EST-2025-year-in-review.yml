    [AI Written] 2025 in Review: From Agentic AI to the Trillion-Parameter Era
- author: Thom Morgan
- readtime: 8 minutes
- tags: Year in Review, Future of AI, Trends, 2025
- content: |
    As 2025 draws to a close, we reflect on a year that redefined our relationship with machines. The defining theme was the rise of **"Agentic AI."**

    From the early (and shaky) promise of Devin in Q1 to the robust autonomy of **Claude 4.5** and **Gemini 3 Flash** by Q4, AI is no longer just a chatbot—it is a coworker.

    ## The Numbers

    - **$100 Billion**: Amount invested in AI hardware alone this year.
    - **54%**: Percentage of enterprise code now written or refactored by AI.
    - **3**: Number of major regulatory frameworks enacted globally (EU, China, US Executive Orders).

    ## Looking Ahead to 2026: The Zettascale Era

    Experts predict 2026 will bring the first "Zettascale" training runs, potentially unlocking capabilities we can't yet fully predict. With 100k+ H100 clusters now standard for frontier labs, the constraint is no longer compute—it's energy.

    The race for fusion and small modular reactors (SMRs) to power these data centers will likely define the narrative of the coming year.
